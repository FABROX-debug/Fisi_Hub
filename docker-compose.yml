services:
  db:
    image: postgres:16-alpine
    container_name: fisihub_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: fisihub
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/fisihub_dump.sql:/docker-entrypoint-initdb.d/fisihub_dump.sql:ro
      - ./database/init.sh:/docker-entrypoint-initdb.d/zz_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fisihub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: fisihub_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fisihub
      DB_USER: postgres
      DB_PASSWORD: change-me
      JWT_SECRET: change-this-for-a-random-secret-with-at-least-32-characters
      JWT_EXPIRATION_MS: 86400000
      APP_FRONTEND_URL: http://localhost
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: fisihub_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
